# Render Blueprint: one free Node web service for SkyTide.
# In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: skytide
    runtime: node
    plan: free
    buildCommand: "true"        # nothing to install, zero dependencies
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_HOSTS      # add your custom domain(s) here, comma separated
        value: ""
      - key: AISSTREAM_KEY      # optional: free key from aisstream.io for worldwide ships
        sync: false
